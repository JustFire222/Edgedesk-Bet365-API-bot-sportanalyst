name: aggiorna
on:
  schedule: [{cron: "0 7,15 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python pronostici.py
        env: {ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}"}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add pronostici.json && (git commit -m "aggiorna dati" && git push || true)
