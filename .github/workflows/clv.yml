# Salvalo come .github/workflows/clv.yml
name: clv

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 minuti è il minimo; GitHub può ritardare di qualche minuto
  workflow_dispatch: {}

permissions: {contents: write}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python clv_tracker.py update
        env: {ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}"}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          if [ -f data/clv_close.json ]; then git add data/clv_close.json; fi
          git diff --cached --quiet || (git commit -m "clv: chiusure" && git pull --rebase && git push)
